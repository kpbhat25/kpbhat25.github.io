---
layout: default
title: blog
pagination:
  enabled: true
  collection: posts
  permalink: /page/:num/
  per_page: 5
---

<h1>{{ site.blog_name }}</h1>
<h2>{{ site.blog_description }}</h2>

<p>Checking if blog is working...</p>

<ul>
  {% for post in paginator.posts %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
